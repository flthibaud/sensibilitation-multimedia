<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balade en voiture dans Paris</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.13.0/dist/maplibre-gl.css" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #aide {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        font: 14px sans-serif;
        border-radius: 4px;
      }
      #vitesse {
        position: absolute;
        bottom: 20px;
        left: 20px;
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        font: bold 32px sans-serif;
        font-variant-numeric: tabular-nums; /* les chiffres ne "sautent" pas en changeant */
        border-radius: 4px;
      }
      #chargement {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #222;
        color: white;
        font: 24px sans-serif;
        transition: opacity 0.5s;
      }
      #chargement.cache {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="aide">Z / ↑ avancer · S / ↓ freiner, reculer · Q D / ← → tourner · R recommencer · M couper le son</div>
    <div id="vitesse" aria-live="off">0 km/h</div>
    <div id="chargement" role="status">Chargement de Paris…</div>

    <script type="importmap">
      {
        "imports": {
          "maplibre-gl": "https://cdn.jsdelivr.net/npm/maplibre-gl@6.13.0/dist/maplibre-gl.mjs",
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
      }
    </script>
    <script src="./js/main.js" type="module"></script>
  </body>
</html>
